<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-5">
    <div>
      <h2 class="fw-bold mb-1">My Ads</h2>
      <p class="text-muted">Manage your active listings.</p>
    </div>
    <a href="#/add-product" class="btn btn-primary rounded-pill shadow-sm px-4">
      <i class="fa-solid fa-plus me-2"></i> Post New Ad
    </a>
  </div>

  <div class="row g-4" ng-if="myProducts.length > 0">
    <div class="col-sm-6 col-lg-3" ng-repeat="p in myProducts">
      <div class="product-card h-100 position-relative">
        <div class="product-card-img-wrapper">
          <img ng-src="{{ 'http://localhost:5000/uploads/' + p.images[0] }}"
            onerror="this.src='https://placehold.co/300x200?text=No+Image'" alt="{{p.title}}">
          <span class="badge position-absolute top-0 end-0 m-2"
            ng-class="{'bg-success': p.status==='available', 'bg-danger': p.status==='sold', 'bg-secondary': !p.status}">
            {{ p.status || 'Available' }}
          </span>
        </div>

        <div class="card-body">
          <h5 class="card-title text-truncate" title="{{p.title}}">{{ p.title }}</h5>
          <div class="card-price">₹ {{ p.price | number }}</div>
          <p class="small text-muted text-truncate">{{ p.description }}</p>

          <div class="d-grid gap-2 mt-auto">
            <!-- Edit Button (Placeholder functionality) -->
            <!-- <button class="btn btn-outline-primary btn-sm">
                <i class="fa-solid fa-pen-to-square me-1"></i> Edit
            </button> -->
            <button class="btn btn-outline-danger btn-sm" ng-click="delete(p._id)">
              <i class="fa-solid fa-trash me-1"></i> Delete
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div class="text-center py-5" ng-if="!myProducts || myProducts.length === 0">
    <div class="mb-3">
      <div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle"
        style="width:80px; height:80px;">
        <i class="fa-solid fa-box-open fs-1 text-muted"></i>
      </div>
    </div>
    <h4>No products found</h4>
    <p class="text-muted col-md-6 mx-auto">You haven't posted any ads yet. Start selling today!</p>
    <a href="#/add-product" class="btn btn-primary mt-2 rounded-pill px-4">Create Listing</a>
  </div>

</div>
