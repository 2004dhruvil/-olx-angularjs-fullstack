<h3>Seller Details</h3>

<input class="form-control mb-2" placeholder="Name" ng-model="seller.name">
<input class="form-control mb-2" placeholder="Phone" ng-model="seller.phone">
<input class="form-control mb-2" placeholder="Email" ng-model="seller.email">

<button class="btn btn-primary" ng-click="saveSeller()">Continue</button>
