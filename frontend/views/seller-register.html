<div class="auth-container">
  <h3 class="text-center">Seller Register</h3>

  <input type="name" class="form-control mb-3" placeholder="Name" ng-model="seller.name">

  <input type="password" class="form-control mb-3" placeholder="Password" ng-model="seller.password">

  <button class="btn btn-success w-100" ng-click="registerSeller()">
    Register as Seller
  </button>

  <p class="text-center mt-3">
    Already a seller?
    <a href="#/seller/login">Login here</a>
  </p>
</div>
