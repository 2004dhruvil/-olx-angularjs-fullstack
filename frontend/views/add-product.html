<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-header bg-primary text-white p-4 rounded-top-4">
          <h3 class="mb-0 fw-bold"><i class="fa-solid fa-camera me-2"></i> {{ titleText }}</h3>
          <p class="mb-0 opacity-75">Fill in the details to sell your item quickly.</p>
        </div>

        <div class="card-body p-4 p-md-5">
          <form name="addProductForm">

            <div class="mb-4">
              <label class="form-label fw-bold text-uppercase small text-muted">Title</label>
              <input type="text" class="form-control form-control-lg"
                placeholder="Ad title (e.g. Samsung Galaxy S23, 2020 Honda City)" ng-model="product.title" required>
            </div>

            <div class="row mb-4">
              <div class="col-md-6">
                <label class="form-label fw-bold text-uppercase small text-muted">Price (₹)</label>
                <div class="input-group input-group-lg">
                  <span class="input-group-text bg-light border-end-0">₹</span>
                  <input type="number" class="form-control border-start-0 ps-0" placeholder="Price"
                    ng-model="product.price" required>
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold text-uppercase small text-muted">Category</label>
                <select class="form-select form-select-lg" ng-model="product.category" required>
                  <option value="" disabled selected>Select Category</option>
                  <option>Mobiles</option>
                  <option>Cars</option>
                  <option>Property</option>
                  <option>Electronics</option>
                  <option>Furniture</option>
                  <option>Bikes</option>
                </select>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold text-uppercase small text-muted">Description</label>
              <textarea class="form-control" rows="5" placeholder="Include condition, features and reason for selling"
                ng-model="product.description" required></textarea>
              <div class="form-text text-end">0 / 4096</div>
            </div>

            <div class="mb-5">
              <label class="form-label fw-bold text-uppercase small text-muted">Upload Photos (Up to 3)</label>
              <div class="p-4 border-2 border-dashed rounded-3 bg-light">
                
                <!-- Image 1 -->
                <div class="mb-4">
                  <label class="small text-muted mb-1">Main Image (Required)</label>
                  <input type="file" file-model="product.image1" class="form-control">
                  <div ng-if="isEdit && existingImages[0]" class="mt-2">
                    <img ng-src="{{ 'http://localhost:5000/uploads/' + existingImages[0] }}" style="height: 60px;" class="rounded border">
                  </div>
                </div>

                <!-- Image 2 -->
                <div class="mb-4">
                  <label class="small text-muted mb-1">Optional Image 2</label>
                  <input type="file" file-model="product.image2" class="form-control">
                  <div ng-if="isEdit && existingImages[1]" class="mt-2">
                    <img ng-src="{{ 'http://localhost:5000/uploads/' + existingImages[1] }}" style="height: 60px;" class="rounded border">
                  </div>
                </div>

                <!-- Image 3 -->
                <div class="mb-2">
                  <label class="small text-muted mb-1">Optional Image 3</label>
                  <input type="file" file-model="product.image3" class="form-control">
                  <div ng-if="isEdit && existingImages[2]" class="mt-2">
                    <img ng-src="{{ 'http://localhost:5000/uploads/' + existingImages[2] }}" style="height: 60px;" class="rounded border">
                  </div>
                </div>
                
                <p class="small text-muted mt-3 mb-0 text-center"><i class="fa-solid fa-circle-info me-1"></i> Supports JPG, PNG</p>
              </div>
            </div>

            <div class="d-grid gap-2">
              <button class="btn btn-primary btn-lg rounded-pill shadow-sm" ng-click="addProduct()"
                ng-disabled="addProductForm.$invalid && !isEdit">
                <i class="fa-solid fa-paper-plane me-2"></i> {{ buttonText }}
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
